<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Панель управления{% endblock %} — InnerBlitz</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons & Chart.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-brand {
            box-shadow: 0 0 25px -5px rgba(124, 58, 237, 0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.7); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside class="w-64 glass flex flex-col border-r border-slate-800/80 z-20 transition-all duration-300">
            <!-- Brand Logo -->
            <div class="p-6 flex items-center gap-3 border-b border-slate-800/80">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center glow-brand text-white font-bold">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">InnerBlitz</h1>
                    <span class="text-xs text-brand-400/80 font-mono">v2.0 Hysteria 2</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:text-white hover:bg-slate-800/60 {% if request.url.path == '/' %}bg-brand-600/20 text-brand-300 border border-brand-500/30 font-medium{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Дашборд</span>
                </a>
                <a href="/users" class="flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:text-white hover:bg-slate-800/60 {% if request.url.path == '/users' %}bg-brand-600/20 text-brand-300 border border-brand-500/30 font-medium{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span>Пользователи</span>
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:text-white hover:bg-slate-800/60 {% if request.url.path == '/settings' %}bg-brand-600/20 text-brand-300 border border-brand-500/30 font-medium{% endif %}">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>Настройки ядрa</span>
                </a>
                <a href="/logs" class="flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:text-white hover:bg-slate-800/60 {% if request.url.path == '/logs' %}bg-brand-600/20 text-brand-300 border border-brand-500/30 font-medium{% endif %}">
                    <i data-lucide="terminal" class="w-5 h-5"></i>
                    <span>Системные логи</span>
                </a>
            </nav>

            <!-- Bottom Status Indicator -->
            <div class="p-4 border-t border-slate-800/80">
                <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <span id="hysIndicator" class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <div class="text-xs">
                            <p class="font-medium text-slate-200">Hysteria Core</p>
                            <p id="hysVersion" class="text-slate-400 text-[10px]">Checking...</p>
                        </div>
                    </div>
                    <button onclick="restartCore()" title="Перезапустить ядро" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top Header Bar -->
            <header class="h-16 glass border-b border-slate-800/80 px-8 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-semibold text-white">{% block page_title %}{% endblock %}</h2>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Live Server IP Badge -->
                    <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-mono text-slate-300">
                        <i data-lucide="globe" class="w-3.5 h-3.5 text-brand-400"></i>
                        <span id="headerServerIp">Loading...</span>
                    </div>

                    <!-- User / Logout -->
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium text-slate-300 flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                            <span id="currentAdminName">admin</span>
                        </span>
                        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-medium transition flex items-center gap-1.5">
                            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                            <span>Выйти</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Body -->
            <main class="flex-1 overflow-y-auto p-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200' : 'bg-red-950/90 border-red-500/40 text-red-200';
            const iconName = type === 'success' ? 'check-circle' : 'alert-circle';
            
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function updateHeaderStatus() {
            try {
                const res = await fetch('/api/system/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('hysVersion').textContent = data.hysteria_version || 'Active';
                    const ind = document.getElementById('hysIndicator');
                    if (data.hysteria_running) {
                        ind.innerHTML = `<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>`;
                    } else {
                        ind.innerHTML = `<span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>`;
                    }
                }
                const setRes = await fetch('/api/settings');
                if (setRes.ok) {
                    const s = await setRes.json();
                    document.getElementById('headerServerIp').textContent = s.server_ip || s.server_domain || '127.0.0.1';
                }
            } catch (e) {}
        }

        async function restartCore() {
            try {
                showToast('Перезапуск Hysteria 2...', 'success');
                const res = await fetch('/api/settings/restart-hysteria', { method: 'POST' });
                const data = await res.json();
                if (data.ok) showToast('Ядро успешно перезапущено!', 'success');
                else showToast('Ошибка перезапуска ядра: ' + data.output, 'error');
                updateHeaderStatus();
            } catch (e) {
                showToast('Ошибка сети', 'error');
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (e) {
                window.location.href = '/login';
            }
        }

        updateHeaderStatus();
        setInterval(updateHeaderStatus, 10000);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
