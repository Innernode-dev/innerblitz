<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — InnerBlitz Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/innerblitz.css">
</head>
<body class="ib-canvas bg-[#07090e] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-slate-950 relative overflow-hidden">

    <div class="ib-hero-card w-full max-w-md rounded-2xl p-7 sm:p-8 relative z-10 space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 via-cyan-400 to-emerald-300 flex items-center justify-center text-slate-950 font-extrabold mx-auto mb-3 shadow-xl shadow-cyan-500/25">
                <i data-lucide="zap" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">InnerBlitz</h1>
            <p class="text-xs text-slate-400 font-mono">Hysteria 2 Control Plane</p>
        </div>

        <!-- Error Alert -->
        <div id="loginError" class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-200 text-xs font-medium hidden flex items-center gap-2.5">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 flex-shrink-0"></i>
            <span id="loginErrorMsg">Ошибка входа</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <!-- Step 1: Username & Password -->
            <div id="credentialsStep" class="space-y-4">
                <div>
                    <label for="usernameInput" class="block text-xs font-semibold text-slate-300 mb-1.5">Логин администратора</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="usernameInput" required autofocus autocomplete="username" placeholder="admin"
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#070a10] border border-[#1d2536] text-sm text-white placeholder-slate-500 font-mono">
                    </div>
                </div>

                <div>
                    <label for="passwordInput" class="block text-xs font-semibold text-slate-300 mb-1.5">Пароль</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••"
                               class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#070a10] border border-[#1d2536] text-sm text-white placeholder-slate-500">
                        <button type="button" onclick="togglePasswordVisibility()" tabindex="-1" title="Показать или скрыть пароль"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-200 transition p-1">
                            <i id="pwdEyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Step 2: 2FA (shown only if required) -->
            <div id="twoFactorStep" class="space-y-3 hidden">
                <div class="p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-200 text-xs flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4 text-cyan-400 flex-shrink-0"></i>
                    <span id="twoFactorPrompt">Введите 6-значный код двухфакторной аутентификации</span>
                </div>
                <div>
                    <label for="twoFactorCode" class="block text-xs font-semibold text-slate-300 mb-1.5">Код подтверждения (2FA)</label>
                    <input type="text" id="twoFactorCode" inputmode="numeric" maxlength="6" placeholder="000000"
                           class="w-full px-4 py-3 rounded-xl bg-[#070a10] border border-[#1d2536] text-center font-mono text-xl tracking-[0.35em] text-white">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="ib-btn-primary w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2">
                <span id="btnText">Войти в панель</span>
                <i data-lucide="log-in" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="flex items-center justify-center gap-2 pt-1 text-[11px] text-slate-500 font-mono">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span>Защищённый контур управления</span>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let require2FA = false;
        let twoFactorType = '';

        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('pwdEyeIcon');
            if (!input || !icon) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const errBox = document.getElementById('loginError');
            const errMsg = document.getElementById('loginErrorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            errBox.classList.add('hidden');

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const code = document.getElementById('twoFactorCode').value.trim();

            const payload = { username, password };
            if (require2FA) {
                if (twoFactorType === 'totp') payload.totp_code = code;
                if (twoFactorType === 'telegram') payload.tg_code = code;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');
            const prevText = btnText.textContent;
            btnText.textContent = 'Проверка...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    if (data.require_2fa) {
                        require2FA = true;
                        twoFactorType = data.type;
                        document.getElementById('twoFactorPrompt').textContent = data.message;
                        document.getElementById('twoFactorStep').classList.remove('hidden');
                        document.getElementById('credentialsStep').classList.add('opacity-50', 'pointer-events-none');
                        document.getElementById('twoFactorCode').focus();
                        btnText.textContent = 'Подтвердить код';
                        return;
                    }
                    window.location.href = '/';
                } else {
                    errMsg.textContent = data.detail || 'Неверный логин или пароль';
                    errBox.classList.remove('hidden');
                    btnText.textContent = prevText;
                }
            } catch (err) {
                errMsg.textContent = 'Ошибка подключения к серверу';
                errBox.classList.remove('hidden');
                btnText.textContent = prevText;
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
